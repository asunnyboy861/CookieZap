<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookieZap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="images/icon-48.png" alt="CookieZap" class="logo">
      <h1>CookieZap</h1>
    </div>

    <div class="toggle-section">
      <label class="toggle-label">
        <span>Enable</span>
        <div class="toggle-switch">
          <input type="checkbox" id="enableToggle" checked>
          <span class="toggle-slider"></span>
        </div>
      </label>
    </div>

    <div class="stats-section">
      <div class="stat-item">
        <span class="stat-value" id="todayCount">0</span>
        <span class="stat-label">Today</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="totalCount">0</span>
        <span class="stat-label">Total</span>
      </div>
    </div>

    <div class="mode-section">
      <span class="section-label">Blocking Mode</span>
      <div class="mode-buttons">
        <button class="mode-btn active" data-mode="smart">Smart</button>
        <button class="mode-btn" data-mode="hide">Hide</button>
        <button class="mode-btn" data-mode="block">Block</button>
      </div>
    </div>

    <div class="footer">
      <a href="#" id="openApp">Open App</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
